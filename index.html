<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Best Print Cairo</title>
<meta name="theme-color" content="#f4f5f7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f5f7; --ink:#15171c; --muted:#5d626d; --card:#ffffff; --line:#e1e3e8;
    --c:#00aeef; --m:#ec008c; --y:#ffd400; --k:#15171c;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#101216; --ink:#f2f3f5; --muted:#a3a8b3; --card:#1a1d23; --line:#2a2e36; --k:#f2f3f5; }
  }
  *{box-sizing:border-box;margin:0}
  html,body{min-height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
    padding:max(28px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom));
    display:flex; justify-content:center;
  }
  main{width:100%; max-width:440px}
  header{text-align:center; padding:12px 0 26px}
  .dots{position:relative; width:92px; height:64px; margin:0 auto 18px}
  .dots i{position:absolute; width:44px; height:44px; border-radius:50%; mix-blend-mode:multiply}
  @media (prefers-color-scheme: dark){ .dots i{mix-blend-mode:screen; opacity:.9} }
  .dots i:nth-child(1){background:var(--c); left:6px; top:0}
  .dots i:nth-child(2){background:var(--m); left:28px; top:0}
  .dots i:nth-child(3){background:var(--y); left:17px; top:18px}
  h1{font-size:2rem; font-weight:800; letter-spacing:.2px; direction:ltr}
  header p{color:var(--muted); margin-top:6px; font-size:1.02rem}

  .save{
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:17px; border:0; border-radius:14px; cursor:pointer;
    background:var(--ink); color:var(--bg); font:800 1.1rem "Tajawal",sans-serif;
    margin-bottom:14px;
  }
  .save:active{transform:scale(.99)}

  nav{display:grid; gap:10px}
  .link{
    display:flex; align-items:center; gap:14px; text-decoration:none; color:var(--ink);
    background:var(--card); border:1px solid var(--line);
    border-inline-start:6px solid var(--accent);
    border-radius:12px; padding:15px 16px; font-weight:700; font-size:1.08rem;
  }
  .link small{display:block; color:var(--muted); font-weight:400; font-size:.88rem; margin-top:1px}
  .link svg{flex:none; width:26px; height:26px; fill:none; stroke:var(--ink); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
  .link:active{background:var(--line)}
  .link:focus-visible,.save:focus-visible{outline:3px solid var(--m); outline-offset:2px}
  footer{text-align:center; color:var(--muted); font-size:.8rem; margin-top:26px; direction:ltr}
</style>
</head>
<body>
<main>
  <header>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <h1>Best Print Cairo</h1>
    <p>للطباعة والتغليف والدعاية</p>
  </header>

  <button class="save" id="saveBtn" type="button">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    احفظ الرقم في جهات الاتصال
  </button>

  <nav id="links"></nav>
  <footer>Best Print Cairo</footer>
</main>

<script>
/* ============ عدّل البيانات دي بس ============ */
const CONFIG = {
  name:      "best print cairo",             // الاسم اللي هيتحفظ في الموبايل
  phone:     "+201018000026",                // رقم التليفون بالصيغة الدولية
  whatsapp:  "201018000026",                 // رقم الواتس بدون + ولا أصفار (20 + الرقم)
  whatsappMsg: "أهلاً، عايز أستفسر عن الطباعة",
  facebook:  "https://www.facebook.com/Best.Print55",
  review:    "https://search.google.com/local/writereview?placeid=ChIJLfqsNvMVWBQRD0I4kE2SrmA",
  location:  "https://maps.app.goo.gl/pEh5X5TmLqhNTh3JA"
};
/* ============================================ */

const icons = {
  call:'<svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',
  wa:'<svg viewBox="0 0 24 24"><path d="M3 21l1.6-4.6A8.5 8.5 0 1 1 8 19.5z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8a4 4 0 0 1-1.8-1.8l.8-1-1-2z"/></svg>',
  fb:'<svg viewBox="0 0 24 24"><path d="M14 8h3V4h-3a4 4 0 0 0-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8z"/></svg>',
  star:'<svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.8-4.4 4.2 1.1 6.1L12 16.8 6.5 19.7l1.1-6.1L3.2 9.4l6.1-.8z"/></svg>',
  pin:'<svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>'
};

const items = [
  { href:"https://wa.me/"+CONFIG.whatsapp+"?text="+encodeURIComponent(CONFIG.whatsappMsg), title:"واتساب", sub:"ابعتلنا رسالة", icon:icons.wa, accent:"var(--c)" },
  { href:"tel:"+CONFIG.phone, title:"اتصل بينا", sub:CONFIG.phone, icon:icons.call, accent:"var(--m)" },
  { href:CONFIG.facebook, title:"فيسبوك", sub:"صفحتنا على فيسبوك", icon:icons.fb, accent:"var(--y)" },
  { href:CONFIG.location, title:"اللوكيشن", sub:"افتح على خرائط جوجل", icon:icons.pin, accent:"var(--k)" },
  { href:CONFIG.review, title:"قيّمنا على جوجل", sub:"رأيك يهمنا", icon:icons.star, accent:"var(--c)" }
];

const nav = document.getElementById("links");
items.forEach(function(it){
  const a = document.createElement("a");
  a.className = "link"; a.href = it.href; a.style.setProperty("--accent", it.accent);
  if(it.href.indexOf("http")===0){ a.target="_blank"; a.rel="noopener"; }
  a.innerHTML = it.icon + '<span>' + it.title + '<small>' + it.sub + '</small></span>';
  nav.appendChild(a);
});

document.getElementById("saveBtn").addEventListener("click", function(){
  const vcf = [
    "BEGIN:VCARD","VERSION:3.0",
    "FN:"+CONFIG.name,
    "N:;"+CONFIG.name+";;;",
    "ORG:"+CONFIG.name,
    "TEL;TYPE=CELL,VOICE:"+CONFIG.phone,
    "URL:"+CONFIG.facebook,
    "END:VCARD"
  ].join("\r\n");
  const blob = new Blob([vcf], {type:"text/vcard;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "best-print-cairo.vcf";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
});
</script>
</body>
</html>
